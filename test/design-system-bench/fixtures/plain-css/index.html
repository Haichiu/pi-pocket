<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Fieldnotes</title>
        <link rel="stylesheet" href="src/styles/app.css" />
    </head>
    <body id="top">
        <main id="main">
            <h1>Today</h1>
            <div class="card">
                <h2>Harbour walk</h2>
                <p>Low tide at six. <a href="#top">Back to top</a></p>
                <span class="chip chip--success">Synced</span>
                <span class="chip chip--warning">Draft</span>
                <p><small class="meta">Edited 4 minutes ago</small></p>
            </div>
            <button class="btn">New note</button>
            <button class="btn btn--danger">Delete</button>
        </main>
    </body>
</html>
