<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Status</title>
        <link rel="stylesheet" href="ds/tokens.css" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: var(--color-bg-default);
                color: var(--color-text-primary);
                font: var(--font-weight-regular) var(--font-size-md) / var(--font-leading-normal)
                    var(--font-family-body);
            }
            .top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-4);
                padding: var(--space-2) var(--space-4);
                background: var(--color-bg-surface);
                border-bottom: var(--size-border) solid var(--color-border-default);
            }
            .brand {
                display: inline-flex;
                align-items: center;
                min-height: var(--size-tap);
                color: var(--color-text-primary);
                font-weight: var(--font-weight-bold);
                text-decoration: none;
            }
            .nav {
                display: flex;
                gap: var(--space-2);
            }
            .nav a {
                display: inline-flex;
                align-items: center;
                min-height: var(--size-tap);
                padding: 0 var(--space-3);
                color: var(--color-text-muted);
                border-radius: var(--radius-md);
                text-decoration: none;
            }
            .nav a[aria-current] {
                color: var(--color-text-primary);
                background: var(--color-bg-subtle);
            }
            .main {
                display: flex;
                flex-direction: column;
                gap: var(--space-6);
                max-width: var(--size-container);
                margin: 0 auto;
                padding: var(--space-8) var(--space-4);
            }
            h1 {
                font-size: var(--font-size-2xl);
                font-weight: var(--font-weight-bold);
                line-height: var(--font-leading-tight);
            }
            h2 {
                font-size: var(--font-size-lg);
                font-weight: var(--font-weight-bold);
                line-height: var(--font-leading-tight);
            }
            h3 {
                font-size: var(--font-size-md);
                font-weight: var(--font-weight-bold);
                line-height: var(--font-leading-tight);
            }
            .lede,
            .hint {
                color: var(--color-text-muted);
            }
            .hint {
                font-size: var(--font-size-sm);
            }
            .card {
                display: flex;
                flex-direction: column;
                gap: var(--space-3);
                padding: var(--space-6);
                background: var(--color-bg-surface);
                border: var(--size-border) solid var(--color-border-default);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-sm);
            }
            label {
                font-size: var(--font-size-sm);
                font-weight: var(--font-weight-medium);
            }
            input {
                min-height: var(--size-tap);
                padding: 0 var(--space-3);
                color: inherit;
                background: var(--color-bg-surface);
                border: var(--size-border) solid var(--color-border-default);
                border-radius: var(--radius-md);
                font: inherit;
            }
            .btn {
                min-height: var(--size-tap);
                padding: 0 var(--space-4);
                border: var(--size-border) solid transparent;
                border-radius: var(--radius-md);
                font: inherit;
                font-weight: var(--font-weight-medium);
                cursor: pointer;
                transition: background var(--motion-duration-fast) var(--motion-ease-standard);
            }
            .btn.primary {
                color: var(--color-text-inverse);
                background: var(--color-accent-default);
            }
            .btn.primary:hover {
                background: var(--color-accent-hover);
            }
            .btn.secondary {
                color: var(--color-text-primary);
                background: var(--color-bg-surface);
                border-color: var(--color-border-default);
            }
            .btn:focus-visible,
            input:focus-visible,
            a:focus-visible {
                outline: var(--size-ring) solid var(--color-focus-ring);
                outline-offset: var(--space-1);
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: var(--space-2);
            }
            .badge {
                display: inline-flex;
                align-items: center;
                align-self: flex-start;
                min-height: var(--space-6);
                padding: 0 var(--space-2);
                color: var(--color-success-default);
                background: var(--color-bg-subtle);
                border-radius: var(--radius-full);
                font-size: var(--font-size-xs);
                font-weight: var(--font-weight-medium);
            }
            .badge-low {
                display: inline-flex;
                align-items: center;
                align-self: flex-start;
                min-height: var(--space-6);
                padding: 0 var(--space-2);
                color: var(--color-text-muted);
                background: var(--color-accent-default);
                border-radius: var(--radius-full);
                font-size: var(--font-size-sm);
            }
            .ghost-text {
                color: var(--color-border-default);
            }
            .chip {
                display: inline-flex;
                align-items: center;
                align-self: flex-start;
                min-height: var(--space-6);
                padding: 0 var(--space-2);
                color: var(--color-accent-default);
                background: var(--color-accent-hover);
                border-radius: var(--radius-sm);
                font-size: var(--font-size-sm);
            }
        </style>
    </head>
    <body data-pid="page">
        <main class="main" data-pid="main">
            <h1 data-pid="title">Build status</h1>
            <span class="badge-low" data-pid="badge-low">Queued</span>
            <p class="ghost-text" data-pid="ghost-text">Last run finished 4 minutes ago.</p>
            <span class="chip" data-pid="chip">main</span>
            <p class="hint" data-pid="hint">Statuses refresh every minute.</p>
            <span class="badge" data-pid="ok-badge">Passing</span>
        </main>
    </body>
</html>
